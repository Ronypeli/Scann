<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebScan - Escáner PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    
    <!-- Carga de librerías -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="cvReady()" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #00adb5;
            --text: #eeeeee;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--surface); padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #333; }
        
        #app-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; }
        
        .canvas-container { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; min-height: 250px; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        #placeholder-text { position: absolute; color: #666; text-align: center; padding: 20px; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button, .file-upload { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; display: flex; justify-content: center; align-items: center; gap: 5px; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; background: #555; }
        button:active { opacity: 0.8; }
        
        .full-width { grid-column: 1 / -1; }
        input[type="file"] { display: none; }
        
        #ocr-text { width: 100%; height: 100px; background: var(--surface); border: 1px solid #333; color: var(--text); border-radius: 8px; padding: 10px; resize: none; font-size: 0.9rem; grid-column: 1 / -1; }
        
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; z-index: 100; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>WebScan Scanner</header>

    <div id="app-container">
        <div class="canvas-container" id="canvas-box">
            <span id="placeholder-text">Sube o toma una foto para escanearla</span>
            <canvas id="image-canvas"></canvas>
        </div>

        <div class="controls">
            <label class="file-upload" style="background: #00796b;">
                📷 Cámara
                <input type="file" id="file-camera" accept="image/*" capture="environment">
            </label>
            <label class="file-upload" style="background: #00adb5;">
                🖼️ Galería
                <input type="file" id="file-gallery" accept="image/*">
            </label>
            
            <button id="btn-enhance" disabled>✨ Mejorar</button>
            <button id="btn-ocr" disabled>🔍 Extraer Texto</button>
            
            <textarea id="ocr-text" placeholder="El texto extraído aparecerá aquí..." readonly></textarea>
            
            <button id="btn-pdf" class="full-width" disabled>📄 Descargar PDF</button>
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <span id="loader-text">Procesando...</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
